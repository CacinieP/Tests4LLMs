name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile-check all Python files
        run: |
          python -m py_compile tests4llms-v0.2.py
          python -m py_compile legacy/tests4llms-v0.1.py
      - name: Smoke test (CLI parses without network)
        run: |
          # --help exits 0 and exercises argparse + provider resolution paths
          python tests4llms-v0.2.py --help
          # Invalid provider must exit non-zero (guard against `|| true` masking)
          if python tests4llms-v0.2.py --provider nonexistent </dev/null 2>/dev/null; then
            echo "ERROR: unknown provider should have failed" >&2
            exit 1
          fi
          echo "unknown-provider rejection: OK"
      - name: Lint with flake8 (syntax/undefined-name only)
        run: |
          pip install flake8
          flake8 tests4llms-v0.2.py --count --select=E9,F63,F7,F82 --show-source --statistics
